        notes: "歡迎加入後端與資料工程團隊！這份簡報由我們的實務 LLM Wiki 編譯而成。許多新手工程師在學校或 Side Project 習慣了單機、無併發的環境，但在真實 Production 中，亂用 Git reset、忘了設 K8s Probe、或在 Redis 塞一顆 20MB 的 Key，都可能引發線上災難。今天我們用 5 大模組帶大家建立實戰護欄。",
        html: `
          <div class="space-y-8">
            <div class="p-8 rounded-2xl border surface-card bg-gradient-to-br from-blue-600/10 via-indigo-500/5 to-transparent relative overflow-hidden">

                <span>ENGINEERING ONBOARDING PLAYBOOK</span>
              </div>

                新手後端工程師實務須知

              <p class="text-base md:text-lg text-secondary max-w-3xl leading-relaxed">

                <p class="text-xs text-secondary leading-relaxed">PM/FE/BE/QA/SRE 邊界、測試左移、Feature Flags 小步快跑</p>
              </div>
              <div onclick="goToSlide(5)" class="cursor-pointer p-4 rounded-xl border surface-card hover:border-amber-500 transition group">
                <div class="text-xs font-bold text-amber-500 mb-1">MODULE 03</div>
                <div class="font-bold text-base mb-1.5 group-hover:text-amber-400">快取與 Redis 避坑</div>
                <p class="text-xs text-secondary leading-relaxed">Cache-Aside、穿透/擊穿/雪崩防禦、20MB BigKey + HotKey 災難</p>
              </div>
              <div onclick="goToSlide(7)" class="cursor-pointer p-4 rounded-xl border surface-card hover:border-purple-500 transition group">

              </div>
              <div onclick="goToSlide(9)" class="cursor-pointer p-4 rounded-xl border surface-card hover:border-cyan-500 transition group">
                <div class="text-xs font-bold text-cyan-500 mb-1">MODULE 05</div>
                <div class="font-bold text-base mb-1.5 group-hover:text-cyan-400">K8s 容器化上線</div>

              </div>

      },
      {
        id: 2,
        module: "Module 01 · Git 版控實戰",
        title: "Git 核心紀律：Atomic Commit 與緊急插單應對",
        subtitle: "讓每個 Commit 具備獨立性，隨時可搬移、隨時可安全退版",
        wikiRef: "[[tools/git]] | [[playbooks/git-version-control-and-history-management]]",
        notes: "為什麼我們嚴格要求 Atomic Commit（原子化提交）？因為真實職場上常遇到老闆或 PM 說：『feature 分支那 20 個功能先緩緩，但裡面那個匯出 CSV 的小功能今天先幫我上 main！』如果你把三個半成品跟修 Bug 塞在同一個 Commit，你就只能痛苦地手動貼程式碼；只要保持 Atomic Commit，一行 git cherry-pick 就能完美摘取。",
        html: `
          <div class="space-y-6">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-blue-500">Module 01 · Git 版本控制實務</span>
              <h2 class="text-2xl md:text-3xl font-bold mt-1">Atomic Commit 原則與隕石插單 SOP</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <!-- Atomic Commit -->
              <div class="p-5 rounded-xl border surface-card space-y-3">
                <div class="flex items-center justify-between">
                  <h3 class="font-bold text-lg text-blue-400">1. Atomic Commit（原子化提交）</h3>
                  <span class="text-xs px-2 py-0.5 rounded bg-blue-500/15 text-blue-400 font-semibold">核心紀律</span>
                </div>
                <p class="text-sm text-secondary">一個 Commit <strong>只做一件事</strong>（單一職責），且在該節點能獨立編譯與通過測試。嚴禁把「修 A Bug + 順手排版 B 檔 + 寫一半的 C 功能」綁在一起提交。</p>
                <div class="p-3 rounded-lg muted-box border text-xs space-y-1.5">
                  <div class="font-semibold text-emerald-400">✅ 實務兩大收益：</div>
                  <div>• <strong>單點提前釋出</strong>：PM 臨時要把開發分支中的某個小功能先拉上 <code>main</code>，可直接用 <code>git cherry-pick &lt;hash&gt;</code> 無痛複製。</div>
                  <div>• <strong>精準安全退版</strong>：線上出包時，可單獨對該筆 Commit 執行 <code>git revert</code>，不誤傷其他正常功能。</div>
                </div>
              </div>

              <!-- Meteorite Interruption SOP -->
              <div class="p-5 rounded-xl border surface-card space-y-3">
                <div class="flex items-center justify-between">
                  <h3 class="font-bold text-lg text-amber-400">2. 遭遇「隕石插單 / 緊急 Hotfix」SOP</h3>
                  <span class="text-xs px-2 py-0.5 rounded bg-amber-500/15 text-amber-400 font-semibold">git stash</span>
                </div>
                <p class="text-sm text-secondary">功能改到一半還沒寫完，突然要切回 <code>main</code> 修線上 P0 Bug？<strong>不要湊合產生無意義的 WIP Commit！</strong></p>
                <pre class="p-3 rounded-lg bg-slate-900 text-slate-100 text-xs overflow-x-auto leading-relaxed"><code># 1. 將當前修改收進暫存倉 (必加 -u 包含新建未追蹤檔案！)
$ git stash push -u -m "WIP: payment validation"

# 2. 切回主幹修完 Hotfix 後，切回原分支取出並移除暫存
$ git switch feature/payment
$ git stash pop   # 若想保留暫存跨多分支套用則用 git stash apply</code></pre>
              </div>
            </div>

            <!-- Bottom comparison: switch/restore & gitignore -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div class="p-4 rounded-xl border muted-box">
                <h4 class="font-bold text-sm mb-2">💡 現代語法推薦 (Git 2.23+) 與遠端同步</h4>
                <ul class="text-xs text-secondary space-y-1.5">
                  <li>• <strong>切換分支</strong>：用 <code>git switch -c feature_1</code> 取代語意混雜的 <code>checkout</code>。</li>
                  <li>• <strong>丟棄工作區修改</strong>：用 <code>git restore file.php</code>；取消 add 用 <code>git restore --staged</code>。</li>
                  <li>• <strong>拉取更新</strong>：<code>git pull</code> = <code>fetch</code> + <code>merge</code>；多人協作建議用 <code>git pull --rebase</code> 維持乾淨線性歷史。</li>
                </ul>
              </div>
              <div class="p-4 rounded-xl border border-rose-500/30 bg-rose-500/5">
                <h4 class="font-bold text-sm text-rose-400 mb-2">⚠️ 版控衛生：.gitignore 常見坑點</h4>
                <p class="text-xs text-secondary leading-relaxed">
                  嚴禁將 <code>.env*</code>、<code>*.key</code>、<code>/vendor</code>、<code>/node_modules</code> 推上 Git！<br/>
                  <strong>坑點</strong>：若檔案已被 Commit 過，事後補寫進 <code>.gitignore</code> 不會生效！必須執行 <code>git rm --cached .env</code> 移除追蹤（若金鑰已外洩請立即至雲端後台撤銷換發）。
                </p>
              </div>
            </div>
          </div>

      {
        id: 3,
        module: "Module 01 · Git 版控實戰",
        title: "Git 歷史修改決策樹與救命三劍客",
        subtitle: "第一鐵則：這筆 Commit 是否已經 Push 到遠端共享分支？",
        wikiRef: "[[playbooks/git-version-control-and-history-management]] | [[tools/git]]",
        notes: "新手最常闖的禍，就是在已經 Push 到遠端共享分支後，還在本地用 git reset 或 commit --amend 改寫歷史並強制 Push (--force)，這會讓所有同事的分支瞬間分岔錯亂。記住黃金法則：本地還沒推上去用 reset/amend 整理；已經推上共享分支一律用 git revert 產生反向抵銷 Commit！萬一不小心 reset --hard 刪錯東西，別慌，git reflog 是你的本機時光機。",
        html: `
          <div class="space-y-5">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-blue-500">Module 01 · Git 歷史紀錄管理</span>
              <h2 class="text-2xl md:text-3xl font-bold mt-1">改寫歷史 vs 安全退版決策樹</h2>
            </div>

            <!-- Decision Banner -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="p-4 rounded-xl border-2 border-emerald-500/40 bg-emerald-500/5">
                <div class="text-xs font-bold text-emerald-400 uppercase mb-1">情境 A：尚未 Push（僅在本地或個人分支）</div>
                <div class="font-bold text-base mb-2">可自由改寫與收斂歷史</div>
                <ul class="text-xs text-secondary space-y-1.5">
                  <li>• <strong>補漏檔案 / 改最後一筆訊息</strong> ➔ <code>git commit --amend</code></li>
                  <li>• <strong>將最近 N 筆零碎測試 Commit 退回重整</strong> ➔ <code>git reset HEAD~N</code></li>
                  <li>• <strong>多筆 Commit 合併/排序/刪除</strong> ➔ <code>git rebase -i HEAD~N</code></li>
                </ul>
              </div>
              <div class="p-4 rounded-xl border-2 border-amber-500/40 bg-amber-500/5">
                <div class="text-xs font-bold text-amber-400 uppercase mb-1">情境 B：已經 Push 到遠端共享分支 (main / develop)</div>
                <div class="font-bold text-base mb-2">嚴禁改寫歷史！必須使用反向抵銷</div>
                <ul class="text-xs text-secondary space-y-1.5">
                  <li>• <strong>退回線上某筆問題 Commit（哪怕是兩個月前）</strong> ➔ <code>git revert &lt;commit-hash&gt;</code></li>
                  <li>• <strong>原理</strong>：計算反向 Diff 並產生一筆<strong>全新的 Commit</strong> 抵銷變更，完整保留歷史軌跡，安全觸發 CI/CD。</li>
                </ul>
              </div>
            </div>

            </div>

                  • <strong>Workload Identity</strong>：<strong>嚴禁將雲端永久有效的 IAM Key 寫死塞進容器！</strong>應綁定 K8s <code>ServiceAccount</code> 動態換取短效期 Token。

        notes: "最後一頁我們把今天所有模組濃縮成 10 條黃金守則。各位在日常開發遇到細節問題時，都可以隨時打開 Obsidian 查看我們 Wiki 裡的對應專頁，裡面有完整的 SQL 範例、架構圖與排查指令。如果在實務上踩到新的坑，也請隨時回饋給我們的 LLM Wiki 持續累積！",
        html: `
          <div class="space-y-5">

    let currentIndex = 0;

    function renderSidebar() {
      const toc = document.getElementById('toc-list');
      toc.innerHTML = slides.map((s, idx) => {
        const active = idx === currentIndex;
        return `
          <button onclick="goToSlide(${idx})" class="w-full text-left px-3 py-2 rounded-lg transition flex items-start gap-2.5 ${active ? 'bg-blue-600 text-white font-semibold shadow-sm' : 'hover:bg-slate-200/60 dark:hover:bg-slate-800/70 text-secondary'}">
            <span class="text-xs font-mono mt-0.5 ${active ? 'text-blue-200' : 'opacity-60'}">${String(idx + 1).padStart(2, '0')}</span>
            <div class="overflow-hidden">
              <div class="text-xs truncate ${active ? 'text-white' : ''}">${s.title}</div>
              <div class="text-[11px] truncate ${active ? 'text-blue-200' : 'opacity-60'}">${s.module}</div>
            </div>
          </button>
        `;
      }).join('');
    }

    function renderSlide() {
      const s = slides[currentIndex];
      const container = document.getElementById('slide-container');
      container.classList.remove('slide-enter');
      void container.offsetWidth; // trigger reflow
      container.classList.add('slide-enter');
      container.innerHTML = s.html;

      document.getElementById('module-badge').textContent = s.module;
      document.getElementById('slide-counter').textContent = `${currentIndex + 1} / ${slides.length}`;
      document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / slides.length) * 100}%`;

      document.getElementById('notes-content').textContent = s.notes;
      document.getElementById('notes-wiki-links').textContent = `Wiki 引用: ${s.wikiRef}`;

      document.getElementById('btn-prev').disabled = currentIndex === 0;
      document.getElementById('btn-next').disabled = currentIndex === slides.length - 1;

      renderSidebar();
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        currentIndex++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide();
      }
    }

    function goToSlide(idx) {
      if (idx >= 0 && idx < slides.length) {
        currentIndex = idx;
        renderSlide();
      }
    }

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('hidden');
    }

    function toggleNotes() {
      const drawer = document.getElementById('notes-drawer');
      drawer.classList.toggle('hidden');
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'n' || e.key === 'N') {
        toggleNotes();
      } else if (e.key === 'd' || e.key === 'D') {
        toggleTheme();
      } else if (e.key === 't' || e.key === 'T') {
        toggleSidebar();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key >= '1' && e.key <= '9') {
        goToSlide(parseInt(e.key, 10) - 1);
      }
    });

    renderSlide();
  </script>
