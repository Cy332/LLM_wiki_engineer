<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新手後端與資料工程實務須知 — Graph-Driven Interactive Presentation</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --bg-muted: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #cbd5e1;
      --graph-bg: #f1f5f9;
      --edge-color: #94a3b8;
    }
    html.dark {
      --bg-main: #070b14;
      --bg-surface: #0f172a;
      --bg-muted: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --graph-bg: #050811;
      --edge-color: #475569;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
    }
    .surface-card {
      background-color: var(--bg-surface);
      border-color: var(--border-color);
    }
    .muted-box {
      background-color: var(--bg-muted);
      border-color: var(--border-color);
    }
    .text-secondary {
      color: var(--text-muted);
    }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .slide-enter {
      animation: fadeZoom 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeZoom {
      from { opacity: 0; transform: scale(0.985) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    /* Flow connector utilities for Micro-Graphs */
    .flow-arrow-r::after {
      content: "→";
      font-weight: bold;
      margin: 0 0.35rem;
      color: #64748b;
    }
    .flow-arrow-d {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #64748b;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.2rem 0;
    }
    /* Pulse animation for active node on macro graph */
    @keyframes pulseRing {
      0% { r: 22px; opacity: 0.7; }
      100% { r: 36px; opacity: 0; }
    }
    .active-ring {
      animation: pulseRing 1.8s infinite ease-out;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 3px; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col select-none">

  </header>

      <!-- Graph Legend & Controls Overlay -->
      <div class="absolute top-3 left-3 right-3 flex items-center justify-between pointer-events-none z-10">

          <span class="font-bold text-secondary">Macro-Graph 知識星系：</span>

        </div>
      </footer>
    </main>
  </div>

          <g onclick="goToSlide(${idx})" class="cursor-pointer group">
            ${isActive ? `<circle cx="${n.x}" cy="${n.y}" r="24" fill="none" stroke="${n.color}" stroke-width="3" class="active-ring" />` : ''}
            <circle cx="${n.x}" cy="${n.y}" r="${isActive ? 21 : 17}"
                    fill="${isActive ? n.color : '#1e293b'}"
                    stroke="${n.color}" stroke-width="${isActive ? 4 : 2.5}" />
            <text x="${n.x}" y="${n.y + 4}" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold" font-family="monospace">
              ${n.id}
            </text>
            <rect x="${n.x - 58}" y="${n.y + 24}" width="116" height="19" rx="5"
                  fill="${isActive ? n.color : 'rgba(15, 23, 42, 0.85)'}" />
            <text x="${n.x}" y="${n.y + 37}" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="${isActive ? 'bold' : 'normal'}">
              ${n.shortLabel}
            </text>
          </g>
        `;
      }).join('');

      document.getElementById('graph-active-label').textContent = `當前聚焦: ${activeNode.id} (${activeNode.shortLabel})`;
    }

    function renderSlide() {
      const node = nodes[currentIndex];
      const container = document.getElementById('slide-container');
      container.classList.remove('slide-enter');
      void container.offsetWidth;
      container.classList.add('slide-enter');
      container.innerHTML = node.html;

      // Update Header & Progress
      const badge = document.getElementById('cluster-badge');
      badge.textContent = node.cluster;
      badge.style.borderColor = node.color;
      badge.style.color = node.color;

      document.getElementById('slide-counter').textContent = `${node.id} (${currentIndex + 1} / ${nodes.length})`;
      document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / nodes.length) * 100}%`;
      document.getElementById('wiki-source-badge').textContent = `Wiki: ${node.wiki}`;
      document.getElementById('notes-text').textContent = node.notes;

      // Render Connected Neighbors Bar
      const connectedEdges = edges.filter(e => e.from === node.id || e.to === node.id);
      const connectedBar = document.getElementById('connected-nodes-bar');
      connectedBar.innerHTML = connectedEdges.map(e => {
        const isOutgoing = e.from === node.id;
        const targetId = isOutgoing ? e.to : e.from;
        const targetNode = getNodeById(targetId);
        const dirArrow = isOutgoing ? '→' : '←';
        return `
          <button onclick="goToSlide(${targetNode.index})"
                  class="px-2.5 py-1 rounded-md border surface-card hover:border-blue-400 transition flex items-center gap-1 font-medium">
            <span class="font-mono font-bold" style="color:${targetNode.color}">${dirArrow} ${targetNode.id}</span>
            <span>${targetNode.shortLabel}</span>
            <span class="text-[10px] text-secondary">(${e.label})</span>
          </button>
        `;
      }).join('');

      document.getElementById('btn-prev').disabled = currentIndex === 0;
      document.getElementById('btn-next').disabled = currentIndex === nodes.length - 1;

      renderMacroGraph();
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      const graphPanel = document.getElementById('macro-graph-panel');
      const slidePanel = document.getElementById('slide-panel');
      const btnSplit = document.getElementById('mode-split');
      const btnGraph = document.getElementById('mode-graph');
      const btnSlide = document.getElementById('mode-slide');

      [btnSplit, btnGraph, btnSlide].forEach(b => {
        b.className = "px-2.5 py-1 rounded-md text-xs font-semibold transition text-secondary hover:text-blue-400";
      });

      if (mode === 'split') {
        graphPanel.classList.remove('hidden', 'w-full');
        graphPanel.classList.add('w-2/5');
        slidePanel.classList.remove('hidden', 'w-full');
        slidePanel.classList.add('w-3/5');
        btnSplit.className = "px-2.5 py-1 rounded-md text-xs font-semibold transition bg-blue-600 text-white";
      } else if (mode === 'graph') {
        graphPanel.classList.remove('hidden', 'w-2/5');
        graphPanel.classList.add('w-full');
        slidePanel.classList.add('hidden');
        btnGraph.className = "px-2.5 py-1 rounded-md text-xs font-semibold transition bg-blue-600 text-white";
      } else if (mode === 'slide') {
        graphPanel.classList.add('hidden');
        slidePanel.classList.remove('hidden', 'w-3/5');
        slidePanel.classList.add('w-full');
        btnSlide.className = "px-2.5 py-1 rounded-md text-xs font-semibold transition bg-blue-600 text-white";
      }
    }

    function goToSlide(idx) {
      if (idx >= 0 && idx < nodes.length) {
        currentIndex = idx;
        if (currentViewMode === 'graph') {
          setViewMode('split');
        }
        renderSlide();
      }
    }

    function nextSlide() {
      if (currentIndex < nodes.length - 1) {
        currentIndex++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide();
      }
    }

    function toggleNotes() {
      document.getElementById('notes-drawer').classList.toggle('hidden');
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'n' || e.key === 'N') {
        toggleNotes();
      } else if (e.key === 'd' || e.key === 'D') {
        toggleTheme();
      } else if (e.key === 'g' || e.key === 'G') {
        setViewMode(currentViewMode === 'graph' ? 'split' : 'graph');
      } else if (e.key === 's' || e.key === 'S') {
        setViewMode(currentViewMode === 'slide' ? 'split' : 'slide');
      }
    });

    renderSlide();
  </script>
</body>
</html>
